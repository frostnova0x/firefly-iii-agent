[project]
name = "firefly-iii-agent"
version = "1.0.0"
description = "Telegram bot that logs transactions to Firefly III via LLM-parsed free-form input."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "frostnova0x" },
]
keywords = ["firefly-iii", "telegram-bot", "personal-finance", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pydantic>=2.5,<3",
    "httpx>=0.27,<1",
    "aiosqlite>=0.19,<1",
    "python-telegram-bot[job-queue]>=21,<22",
    "python-dateutil>=2.9,<3",
    "Pillow>=10,<12",
]

[project.urls]
Homepage = "https://github.com/frostnova0x/firefly-iii-agent"
Issues = "https://github.com/frostnova0x/firefly-iii-agent/issues"

[project.scripts]
firefly-agent = "firefly_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firefly_agent"]

# === Ruff ===
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-too-long (formatter handles it)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# === Mypy ===
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

# === Pytest ===
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit a real Firefly III instance (require env vars)",
    "openrouter_integration: tests that hit real OpenRouter (burns free-tier quota)",
]